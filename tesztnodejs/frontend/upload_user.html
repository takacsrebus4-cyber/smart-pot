<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiók létrehozás | Plant Monitor Pro</title>
    <link rel="stylesheet" href="login_style.css">
</head>

<body>
    <div class="login-container">
        <div class="logo">
            <h1>Hozzon létre új fiókot!</h1>
            <p>Adja meg egy felhasználónevet és egy jelszót.</p>
        </div>

        <form>
            <div class="input-group">
                <label for="username">Felhasználónév</label>
                <input type="text" id="username" placeholder="Felhasználónév" required>
            </div>

            <div class="input-group">
                <label for="password">Jelszó</label>
                <input type="password" id="password" placeholder="Jelszó" required>
            </div>

            <input type="submit" class="login-btn" id="button" value="Fiók létrehozása"></input>
        </form>
    </div>
    <script src="./upload_user.js"></script>
</body>
</html>
