<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pot - CG8WXK</title>
    <link rel="stylesheet" href="login_style.css">

</head>

<body id="dashboard" class="dashboard-container">
    <div class="login-container">
        <div class="logo">
            <h1>Add a new plant!</h1>
            <p>Choose the name of the plant you want to add.</p>
        </div>

        <form>
            <button type="button" id="loadbtn" class="loadbtn">Load Plants</button>
            <select name="plantSelect" id="plantSelect" class="plantSelect">
                <option value="" selected="selected">Select plant to add</option>
            </select>
            <br><br>
            <div class="clearfix">
                <button type="button" id="cancel" class="cancel_btn">Cancel</button>
                <input type="submit" id="upload" class="confirm_btn" value="Upload">
            </div>
        </form>
    </div>

    <script src="./upload_current_plant.js"></script>
    <script src="./token_validation.js"></script>

</body>

</html>
