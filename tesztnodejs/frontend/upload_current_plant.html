<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pot - CG8WXK</title>
    <link rel="stylesheet" href="login_style.css">

</head>

<body id="dashboard" class="dashboard-container">
    <div class="login-container">
        <div class="logo">
            <h1>Add a new plant!</h1>
            <p>Choose the name of the plant you want to add.</p>
        </div>

        <form>
            <div class="input-group">
                <label for="plant_name">Plant name:</label>
                <input type="text" id="plant_name" placeholder="Plant name" required>
            </div>
            <div class="clearfix">
                <button type="button" id="cancel" class="cancel_btn">Cancel</button>
                <button type="submit" id="upload" class="upload_btn">Upload</button>
            </div>
        </form>
    </div>

    <script src="./upload_current_plant.js"></script>
    <script src="./token_validation.js"></script>

</body>

</html>
