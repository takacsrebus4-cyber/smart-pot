<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Növény hozzáadás | Plant Monitor Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login_style.css">

</head>

<body id="dashboard" class="dashboard-container">
    <div class="login-container">
        <div class="logo">
            <h1>Új növény hozzáadása!</h1>
            <p>Válassza ki milyen növényt szeretne hozzáadni.</p>
        </div>

        <form>
            <button type="button" id="loadbtn" class="loadbtn"><i class="fas fa-arrows-rotate"></i> Növények betöltése</button>
            <select name="plantSelect" id="plantSelect" class="plantSelect">
                <option value="" selected="selected">Válassza ki a növényét</option>
            </select>
            <br><br>
            <select id="arduinoSelect" class="plantSelect">
                <option value='0' selected="selected">Arduino hozzárendelése</option>
            </select>
            <br><br>
            <div class="clearfix">
                <button type="button" id="cancel" class="cancel_btn">Mégse</button>
                <input type="submit" id="upload" class="confirm_btn" value="Hozzáadás">
            </div>
        </form>
    </div>

    <script src="./upload_current_plant.js"></script>
    <script src="./token_validation.js"></script>

</body>

</html>
