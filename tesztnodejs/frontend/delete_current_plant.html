<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pot - CG8WXK</title>
    <link rel="stylesheet" href="login_style.css">

</head>

<body id="dashboard" class="dashboard-container">
    <div class="login-container">
        <div class="logo">
            <h1>Delete a plant!</h1>
            <p>Choose the name of the plant you want to delete.</p>
            <p style="font-size: 0.8em; color: red;">Warning: If you delete a plant all the data belonging to the plant will be permanently deleted as well!</p>
        </div>
        <form name="delete-plant" id="delete-plant" action="/action_page.php">
            <button type="button" id="loadbtn" class="loadbtn"><i class="fas fa-arrows-rotate"></i> Load My Plants</button>
            <select name="plantSelect" id="plantSelect" class="plantSelect">
                <option value="" selected="selected">Select plant to delete</option>
            </select>
            <br><br>
            <button type="button" id="cancel" class="cancel_btn">Cancel</button>
            <input type="submit" id="delete" class="confirm_btn" value="Delete">
        </form>
    </div>

    <script src="./delete_current_plant.js"></script>
    <script src="./token_validation.js"></script>

</body>

</html>
