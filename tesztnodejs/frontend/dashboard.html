<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantMonitor Pro | Smart Plant Monitoring</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>

    </style>
</head>

<body>
    <div id="dashboard" class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-seedling"></i>
                <span>PlantMonitor Pro</span>
            </div>
            <ul class="nav-links">
                <li><a href="./dashboard.html" class="active"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href='./my_plants.html'><i class="fas fa-leaf"></i> My Plants</a></li>
                <li><a href="./analytics.html"><i class="fas fa-chart-line"></i> Analytics</a></li>
                <li><a href="#" id="dropdown"><i class="fas fa-user-circle"></i> Profile</a></li>
                <div id="dropdown-container" class="dropdown-container">
                    <li id="logged-in-user"></li>
                    <button id="logout"> Log Out</button>
                    <button id="delete_user"> Delete Account</button>
                </div>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h1>Plant Dashboard</h1>
            </header>

            <!-- Stats Overview -->
            <section class="stats-overview">
                <div class="stat-card">
                    <i class="fas fa-leaf fa-2x" style="color: var(--primary-green);"></i>
                    <div class="stat-value" id="total-plants">5</div>
                    <div class="stat-label">Total Plants</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-tint fa-2x" style="color: var(--primary-green);"></i>
                    <div class="stat-value">2</div>
                    <div class="stat-label">Need Watering</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-temperature-high fa-2x" style="color: var(--primary-green);"></i>
                    <div class="stat-value">1</div>
                    <div class="stat-label">Temperature Alerts</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-heart fa-2x" style="color: var(--primary-green);"></i>
                    <div class="stat-value">2</div>
                    <div class="stat-label">Healthy Plants</div>
                </div>
            </section>

            <h2>My Plants</h2>

            <button id="load-current-plants-btn">Load Plants</button>
            <br><br>

            <!-- Plants Grid -->
            <section>
                <div class="plants-grid">
                </div>
            </section>
        </main>
    </div>

    <!-- Logout Modal -->
    <div id="logout_modal" class="modal">
        <form class="modal-content" action="/action_page.php">
            <div class="container">
                <h1>Log out</h1>
                <p>Are you sure you want to log out?</p>

                <div class="clearfix">
                    <button type="button" id="no_btn" class="no_btn">No</button>
                    <button type="button" id="logout_btn" class="logout_btn">Log out</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Delete User -->
    <div id="delete_user_modal" class="modal">
        <form class="modal-content" action="/action_page.php">
            <div class="container">
                <h1>Delete Account</h1>
                <p class="warning">Warning: This action is irreversible and will remove all your data.</p>
                <div class="clearfix">
                    <button type="button" id="cancel_btn" class="no_btn">Cancel</button>
                    <button type="button" id="delete_btn" class="logout_btn">Delete</button>
                </div>
            </div>
        </form>
    </div>

    <script src="./dashboard.js"></script>
    <script src="./token_validation.js"></script>
    <script src="./logout.js"></script>
    <script src="./delete_user.js"></script>
    <script src="./profile.js"></script>
    <script src="./my_plants.js"></script>
</body>

</html>
